# .github/workflows/ci.yml
#
# Runs automatically on every push to GitHub.
# This is what gives you the little green checkmark badge on your repo,
# and it's what real teams use to catch broken code before it merges.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Check code compiles (no syntax errors)
        run: |
          uv run python -m py_compile src/api/main.py
          uv run python -m py_compile app.py

      - name: Run tests (if any exist)
        run: uv run pytest tests/ -v || echo "No tests found yet — that's OK for now"
